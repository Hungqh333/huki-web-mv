<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Vision</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--app:#F4F6F9;--panel:#FFFFFF;--panel2:#F6F9FB;--panel3:#EFF3F7;--ink:#101826;--ink2:#54626F;--ink3:#8A96A4;--line:#E2E8EE;--line2:#CBD5DF;
--hieu:#3B3F9E;--hieuBg:#EDEEF9;--red:#CF3328;--redBg:#FCEDEB;--amber:#AE6E05;--amberBg:#FCF3DE;
--green:#177F53;--greenBg:#E3F4EC;--blue:#2360A8;--blueBg:#E9F0FA;--violet:#6644A4;--violetBg:#F0EAFA;--teal:#0B7269;--tealBg:#E0F1EF}
:root[data-theme="dark"]{--app:#0E131A;--panel:#161C25;--panel2:#1B222D;--panel3:#212A36;--ink:#E5E9EF;--ink2:#A4AEBB;--ink3:#748190;--line:#28313D;--line2:#3A4551;
--hieu:#7277E4;--hieuBg:#262A4C;--red:#F2675C;--redBg:#3E1D1B;--amber:#E2A23A;--amberBg:#3A2B12;
--green:#43BE86;--greenBg:#173326;--blue:#6BA7EF;--blueBg:#1A2C44;--violet:#AA8DE8;--violetBg:#2D2443;--teal:#41B9AD;--tealBg:#123431}
*{box-sizing:border-box}
body{margin:0;background:var(--app);color:var(--ink);font:13px/1.45 Inter,system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:18px;margin:0 10px 0 0}
.pa{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.pa.on{background:var(--hieu);border-color:var(--hieu);color:#fff;font-weight:600}
.pa.nho{padding:4px 9px;font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--hieu);font-weight:600}
.giai{color:var(--ink2);margin:0 0 12px;max-width:980px}
.giai b{color:var(--ink)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.p{display:inline-block;font-size:11px;font-weight:500;border-radius:99px;padding:1px 8px;white-space:nowrap;line-height:1.5}
.p-amb{background:var(--amberBg);color:var(--amber)}.p-red{background:var(--redBg);color:var(--red)}.p-vio{background:var(--violetBg);color:var(--violet)}
.p-teal{background:var(--tealBg);color:var(--teal)}.p-gr{background:var(--panel3);color:var(--ink2)}.p-blue{background:var(--blueBg);color:var(--blue)}
.p-green{background:var(--greenBg);color:var(--green)}
.k{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.k + .k{margin-top:12px}
.kh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kh h3{margin:0;font-size:14px}
.kb{padding:12px 14px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--ink3);text-align:left;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.mo{color:var(--ink3)}
.cap{font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.f-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f-row > div{display:flex;flex-direction:column;justify-content:flex-end}
label{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:6px 8px;font:inherit}
input[type=checkbox]{width:auto}
.ma-xem{font-family:ui-monospace,Consolas,monospace;font-size:14px;font-weight:600;background:var(--hieuBg);color:var(--ink);padding:10px 12px;border-radius:8px;word-break:break-all}
.loi{color:var(--red);font-size:12px;margin-top:6px}
.ok{color:var(--green)}
.so{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tong{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.o-tong{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.o-tong .n{font-size:20px;font-weight:600}
.o-tong .t{font-size:11px;color:var(--ink3)}
.goi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--line2);background:var(--panel)}
.goi.dat{border-left-color:var(--green)}
.goi.can{border-left-color:var(--amber)}
.goi.khong{border-left-color:var(--red);opacity:.75}
.goi .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.goi ul{margin:6px 0 0;padding-left:18px}
.goi li{margin:2px 0}
.c-xanh{background:var(--greenBg)}.c-vang{background:var(--amberBg)}.c-do{background:var(--redBg)}
.ck td:first-child{width:28px}
.nhom td{background:var(--panel3);font-weight:600}
.phu{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.phu.mo-ra{display:flex}
.hop{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:820px;width:100%;padding:16px}
.hop h3{margin:0 0 4px}
.note{font-size:12px;color:var(--ink3);margin-top:10px}
.an-nho{}
.cap-o{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin-right:7px;border-radius:5px;background:var(--hieu);color:#fff;font-size:11px;font-weight:600;vertical-align:1px}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px}
.chk label{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink);margin:0;cursor:pointer}
@media (max-width:760px){.an-nho{display:none}td,th{padding:6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>PC Vision</h1>
    <span class="mo">Mẫu duyệt — 13 cấu hình trong 6 khung</span>
    <span style="flex:1"></span>
    <span class="mo">Xem như:</span>
    <button class="pa nho on" data-ai="tp">Anh (được sửa)</button>
    <button class="pa nho" data-ai="ks">Kỹ sư (chỉ xem)</button>
    <button class="pa nho" id="nen">Nền sáng</button>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-t="dm">Danh mục cấu hình</div>
    <div class="tab" data-t="gy">Gợi ý cấu hình</div>
    <div class="tab" data-t="fps">Bảng fps</div>
    <div class="tab" data-t="ck">Checklist ổn định</div>
  </div>
  <div id="noi"></div>
</div>

<div class="phu" id="phu"><div class="hop" id="hop"></div></div>

<script>
// ------------------------------------------------------------------ du lieu mau
//  KH = khung (phan co dinh + nang luc). CH = cau hinh cu the trong khung, xep tu nho den lon (Goi y lay cai dau tien du dung).
const PN = "RT-661R-Q670-A10-0001";
const KH = [
  {id:"A", cap:"A", ten:"Cơ bản", pn:"EBS-I10", cpu:"I5-12400", gpu:"0", vram:0, p:250, os:"W11P", rd:"?", sd:"?",
   khe:0, lan:1, tai:120, dung:"Thuật toán cổ điển: đo, đếm, có/không, đọc code", khong:"AI · lắp thêm card mạng", ghi:"Chưa biết RAM/SSD dòng nào — chờ kiểm tra"},
  {id:"B", cap:"B", ten:"Tiêu chuẩn", pn:PN, cpu:"I7-14700", gpu:"0", vram:0, p:650, os:"W11P", rd:"I", sd:"I",
   khe:3, lan:1, tai:330, dung:"Cổ điển nhiều cam, ảnh lớn; AI nhẹ chạy CPU nếu chấp nhận chậm", khong:"AI tốc độ cao", ghi:""},
  {id:"Ct", cap:"C", ten:"AI tiết kiệm", pn:PN, cpu:"I7-14700", gpu:"5070", vram:12, p:1000, os:"W11P", rd:"I", sd:"I",
   khe:2, lan:1, tai:570, dung:"AI suy luận: phân loại, phân đoạn lỗi, OCR khó", khong:"Nhiều cam cổ điển song song", ghi:""},
  {id:"C", cap:"C", ten:"AI", pn:PN, cpu:"I9-14900", gpu:"5070", vram:12, p:1000, os:"W11P", rd:"I", sd:"I",
   khe:2, lan:1, tai:570, dung:"AI suy luận + cổ điển nhiều cam", khong:"Huấn luyện model lớn tại máy", ghi:""},
  {id:"D", cap:"D", ten:"AI cao", pn:PN, cpu:"I9-14900", gpu:"5080", vram:16, p:1300, os:"W11P", rd:"I", sd:"I",
   khe:2, lan:1, tai:680, dung:"AI nặng, ảnh 20MP+, line scan, huấn luyện tại máy", khong:"—", ghi:"Card ~2.5 khe: đo thực tế"},
  {id:"P", cap:"P", ten:"Phụ trợ", pn:"LR-H610M-XA22", cpu:"I5-12400", gpu:"0", vram:0, p:450, os:"W11P", rd:"C", sd:"C",
   khe:0, lan:0, tai:180, dung:"HMI hiển thị cho smart camera", khong:"Thu ảnh, dây chuyền 24/7", ghi:"Linh kiện dòng thường"},
];
const CH = [
  {kh:"A", ten:"A1", r:16, s:"256", d:"D0", dd:""},
  {kh:"B", ten:"B1", r:16, s:"512", d:"D0", dd:""},  {kh:"B", ten:"B2", r:32, s:"512", d:"D1T", dd:"C"}, {kh:"B", ten:"B3", r:64, s:"512", d:"D2T", dd:"C"},
  {kh:"Ct", ten:"Ct1", r:32, s:"1T", d:"D0", dd:""}, {kh:"Ct", ten:"Ct2", r:32, s:"512", d:"D2T", dd:"C"},
  {kh:"C", ten:"C1", r:32, s:"1T", d:"D0", dd:""},   {kh:"C", ten:"C2", r:64, s:"1T", d:"D0", dd:""},    {kh:"C", ten:"C3", r:64, s:"512", d:"D2T", dd:"C"},
  {kh:"D", ten:"D1", r:64, s:"1T", d:"D0", dd:""},   {kh:"D", ten:"D2", r:64, s:"512", d:"D4T", dd:"C"}, {kh:"D", ten:"D3", r:128, s:"1T", d:"D2T", dd:"C"},
  {kh:"P", ten:"P1", r:16, s:"256", d:"D0", dd:""},
];
const khOf = (c) => KH.find(k => k.id === c.kh);
const tenKhung = (k) => `<span class="cap-o">${k.cap}</span>${k.ten}`;   // o chu cap + ten khung
const G_ = (k) => "G" + (k.gpu === "0" ? "0" : k.gpu.toUpperCase() + "V" + k.vram);
const dau = (k) => [k.pn, k.cpu, G_(k), "P" + k.p].join("-");                                       // phan co dinh dau ma
const giua = (k, c) => ["R" + c.r + k.rd, "S" + c.s + k.sd, c.d === "D0" ? "D0" : c.d + c.dd].join("-"); // RAM-SSD-o du lieu
const ma = (c, k = khOf(c)) => [dau(k), giua(k, c), k.os].join("-");
const RX = /^[A-Z0-9][A-Z0-9-]*-(I[3579]|U[579]|RZ[3579])-\d{3,5}[A-Z]{0,2}-G(0|\d{4}(TI|S)?V\d{1,2})-P\d{3,4}-R\d{1,3}[IC]-S(\d{3}|\d{1,2}T)[IC]-(D0|[DH](\d{3}|\d{1,2}T)[IC])-(W11[PL]|LNX|NOS)$/;
const gb = (s) => s.endsWith("T") ? parseFloat(s) * 1024 : parseFloat(s);
const tenO = (s) => s.endsWith("T") ? s.replace("T", "TB") : s + "GB";
const dongHang = (k) => k.rd === "I" && k.sd === "I" ? '<span class="p p-green">RAM + SSD công nghiệp</span>'
  : (k.rd === "?" || k.sd === "?") ? '<span class="p p-amb">Chưa rõ dòng RAM/SSD</span>' : '<span class="p p-red">RAM/SSD dòng thường</span>';
//  Dung luong anh chua duoc: co o du lieu -> 90% o du lieu; khong co -> phan vung anh tren SSD (90% tru ~150GB cho Windows + phan mem + model)
const choAnh = (c) => c.d === "D0" ? Math.max(0, gb(c.s) * 0.9 - 150) / 1024 : gb(c.d.slice(1)) / 1024 * 0.9;
let vaiTro = "tp";

// ------------------------------------------------------------------ tab 1: danh muc
function veDanhMuc() {
  const nhom = KH.map(k => {
    const ds = CH.map((c, i) => ({c, i})).filter(x => x.c.kh === k.id);
    return `<tr class="nhom"><td colspan="6"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span>${tenKhung(k)}</span>
        <span class="p p-gr">${k.cpu.replace("-", " ")}</span>
        <span class="p ${k.gpu === "0" ? "p-gr" : "p-vio"}">${k.gpu === "0" ? "Không GPU" : "RTX " + k.gpu + " · " + k.vram + "GB"}</span>
        <span class="p p-gr">Nguồn ${k.p}W</span>
        <span class="p p-gr">${k.khe === 0 && k.lan === 0 ? "Không thu ảnh" : `${k.lan} LAN + ${k.khe} khe card`}</span>
        ${dongHang(k)}</div>
        <div class="mo" style="font-weight:400;font-size:12px;margin-top:3px">Dùng cho: ${k.dung} · Không dùng cho: ${k.khong}${k.ghi ? ` · <span style="color:var(--amber)">${k.ghi}</span>` : ""}</div></td></tr>`
      + ds.map(({c, i}) => `<tr>
        <td class="cap" style="padding-left:18px">${c.ten}</td>
        <td class="mono"><span class="mo">${dau(k)}-</span><b>${giua(k, c)}</b><span class="mo">-${k.os}</span></td>
        <td class="so">${c.r}GB</td><td class="so">${tenO(c.s)}</td>
        <td class="so">${c.d === "D0" ? '<span class="mo">—</span>' : tenO(c.d.slice(1)) + ` <span class="mo">(${c.dd})</span>`}</td>
        <td>${vaiTro === "tp" ? `<button class="pa nho" onclick="moForm(${i})">Sửa</button>` : ""}</td></tr>`).join("");
  }).join("");
  return `
  <p class="giai">Cấu hình chia theo <b>khung</b> (chassis, CPU, GPU, nguồn). Trong mỗi khung có vài cấu hình cụ thể, khác nhau ở phần <b>in đậm</b> của mã: RAM – SSD hệ thống – ổ dữ liệu.
  Chỉ <b>anh</b> thêm/sửa (máy chủ kiểm tra lại, không chỉ ẩn nút).</p>
  <div class="k">
    <div class="kh"><h3>Danh mục cấu hình (${CH.length})</h3><span style="flex:1"></span>
      <input placeholder="Tìm mã, CPU, GPU…" style="width:220px">
      <select style="width:auto"><option>Đang dùng</option><option>Ngừng dùng</option><option>Tất cả</option></select>
      ${vaiTro === "tp" ? '<button class="pa on" onclick="moForm(-1)">+ Thêm cấu hình</button>' : ""}</div>
    <div style="overflow-x:auto"><table><thead><tr><th style="width:70px">Cấu hình</th><th>Mã</th><th class="so" style="width:70px">RAM</th><th class="so" style="width:90px">SSD hệ thống</th>
      <th class="so" style="width:100px">Ổ dữ liệu</th><th style="width:60px"></th></tr></thead><tbody>${nhom}</tbody></table></div>
  </div>
  <p class="note">RAM luôn 2 thanh cùng lô, chốt lúc đặt hàng. Ổ dữ liệu dòng C (cho phép cả dây chuyền 24/7, kèm điều kiện ở checklist); RAM + SSD hệ thống vẫn dòng I.
  Cấu hình không dùng nữa → "Ngừng dùng", mã không cấp lại.</p>`;
}

// ------------------------------------------------------------------ form them/sua cau hinh
let SUA = -1;
function moForm(i) {
  SUA = i;
  const c = i >= 0 ? {...khOf(CH[i]), ...CH[i]} : {...KH[3], kh:"", ten:"", r:32, s:"512", d:"D1T", dd:"C"};
  const chon = (id, ds, v) => `<select id="${id}">${ds.map(x => `<option ${String(x) === String(v) ? "selected" : ""}>${x}</option>`).join("")}</select>`;
  document.getElementById("hop").innerHTML = `
    <h3>${i >= 0 ? "Sửa cấu hình " + c.ten : "Thêm cấu hình"}</h3>
    <p class="mo" style="margin:0 0 12px">Chọn từng thành phần — mã tự ghép, không gõ tay. Phần khung trùng khung đã có thì tự xếp vào khung đó. Máy chủ kiểm tra lại mã và chống trùng.</p>
    <div class="mo" style="font-size:12px;margin-bottom:4px"><b style="color:var(--ink)">Khung</b></div>
    <div class="f-row">
      <div><label>PN chassis (đúng như hãng)</label><input id="f-pn" value="${c.pn}" list="ds-pn">
        <datalist id="ds-pn"><option>${PN}</option><option>EBS-I10</option><option>LR-H610M-XA22</option></datalist></div>
      <div><label>CPU (dòng-số model)</label><input id="f-cpu" value="${c.cpu}"></div>
      <div><label>Chip GPU (0 = không có)</label>${chon("f-gpu", ["0", "5060", "5060Ti", "5070", "5070Ti", "5080", "5090", "4070S"], c.gpu)}</div>
      <div><label>VRAM GB</label>${chon("f-vram", [0, 8, 12, 16, 24, 32], c.vram)}</div>
      <div><label>Nguồn W</label>${chon("f-p", [250, 450, 500, 650, 850, 1000, 1200, 1300, 1600], c.p)}</div>
      <div><label>Hệ điều hành</label>${chon("f-os", ["W11P", "W11L", "LNX", "NOS"], c.os)}</div>
    </div>
    <div class="mo" style="font-size:12px;margin:12px 0 4px"><b style="color:var(--ink)">RAM – SSD – ổ dữ liệu</b></div>
    <div class="f-row">
      <div><label>RAM GB</label>${chon("f-r", [8, 16, 32, 64, 128], c.r)}</div>
      <div><label>Dòng RAM</label>${chon("f-rd", ["I", "C"], c.rd)}</div>
      <div><label>SSD hệ thống</label>${chon("f-s", ["256", "512", "1T", "2T"], c.s)}</div>
      <div><label>Dòng SSD</label>${chon("f-sd", ["I", "C"], c.sd)}</div>
      <div><label>Ổ dữ liệu</label>${chon("f-d", ["D0", "D512", "D1T", "D2T", "D4T", "H2T", "H4T"], c.d)}</div>
      <div><label>Dòng ổ dữ liệu</label>${chon("f-dd", ["C", "I"], c.dd || "C")}</div>
    </div>
    <div style="margin:14px 0 4px" class="mo">Mã sẽ cấp</div>
    <div class="ma-xem" id="f-ma"></div><div id="f-loi"></div>
    <div class="f-row" style="margin-top:14px">
      <div><label>Tên ngắn</label><input value="${c.ten}" placeholder="vd C4"></div>
    </div>
    <div id="f-khmoi" style="margin-top:10px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="pa" onclick="dongForm()">Huỷ</button><button class="pa on" onclick="dongForm()">Lưu</button></div>`;
  document.querySelectorAll("#hop input,#hop select").forEach(e => e.oninput = tinhMaForm);
  tinhMaForm();
  document.getElementById("phu").classList.add("mo-ra");
}
function tinhMaForm() {
  const v = (id) => document.getElementById(id).value;
  const k = {pn:v("f-pn").trim().toUpperCase(), cpu:v("f-cpu").trim().toUpperCase(), gpu:v("f-gpu"), vram:v("f-vram"), p:v("f-p"), os:v("f-os"), rd:v("f-rd"), sd:v("f-sd")};
  const c = {r:v("f-r"), s:v("f-s"), d:v("f-d"), dd:v("f-dd")};
  const m = ma(c, k);
  document.getElementById("f-ma").textContent = m;
  const loi = [];
  if (!RX.test(m)) loi.push("Mã chưa đúng quy tắc (kiểm tra CPU dạng I9-14900).");
  if (k.gpu !== "0" && k.vram === "0") loi.push("Có GPU thì phải chọn VRAM.");
  if (k.gpu === "0" && k.vram !== "0") loi.push("Không GPU thì VRAM = 0.");
  if (CH.some((x, j) => j !== SUA && ma(x) === m)) loi.push("Mã này đã có trong danh mục.");
  const khoa = (x) => [x.pn, x.cpu, x.gpu.toUpperCase(), x.vram, x.p, x.os, x.rd, x.sd].join("|");
  const kh = KH.find(x => khoa(x) === khoa(k));
  const tai = (k.gpu === "0" ? 0 : ({"5060":150, "5060Ti":180, "5070":250, "5070Ti":300, "5080":360, "5090":575, "4070S":220}[k.gpu] || 300)) + 219 + 100;
  const pt = Math.round(tai / k.p * 100);
  document.getElementById("f-loi").innerHTML = (loi.length ? loi.map(x => `<div class="loi">✕ ${x}</div>`).join("") : '<div class="ok" style="margin-top:6px;font-size:12px">✓ Mã hợp lệ</div>')

// ------------------------------------------------------------------ tab 2: goi y
//  MB/s huu dung moi cong / moi camera. CameraLink: 85MHz (Base 3 tap, Medium 6, Full 8, Deca 10). CXP-12: 1250 MB/s moi lane.
const GT = {"GigE":115, "2.5GigE":280, "5GigE":570, "10GigE":1150, "USB3":380, "CL Base":255, "CL Medium":510, "CL Full":680, "CL Deca":850,
            "CXP-12 ×1":1250, "CXP-12 ×4":5000};
const DP = {"1.3MP (1280×1024)":[1280,1024], "2.3MP (1920×1200)":[1920,1200], "5MP (2448×2048)":[2448,2048],
            "12MP (4096×3000)":[4096,3000], "20MP (5472×3648)":[5472,3648], "25MP (5120×5120)":[5120,5120]};
const NEN = [["1", "Ảnh thô (BMP)"], ["0.5", "PNG (~½)"], ["0.1", "JPEG (~1/10)"]];
let CAM = [
  {ten:"Cam trên", dp:"5MP (2448×2048)", bit:8, fps:10, gt:"GigE", luu:2},
  {ten:"Cam cạnh", dp:"12MP (4096×3000)", bit:8, fps:5, gt:"GigE", luu:1},
];
//  luuAnh = co tinh luu anh hay khong. Tach NG / OK: NG giu lau, anh goc; OK giu it ngay, nen JPEG, chi luu 1 tren N anh
let CHUNG = {ai:"suy_luan", ca:true, luuAnh:false, gio:20, ng:1, ngNgay:30, ngNen:0.5, okNgay:7, okN:10, okNen:0.1};
function themCam() { CAM.push({ten:"Cam " + (CAM.length + 1), dp:"5MP (2448×2048)", bit:8, fps:10, gt:"GigE", luu:1}); ve(); }
function tinh() {
  const r = CAM.map(c => {
    const [w, h] = DP[c.dp]; const mbk = w * h * (c.bit <= 8 ? 1 : c.bit <= 12 ? 1.5 : 2) / 1e6;
    return {...c, mbk, mbs: mbk * c.fps, pt: mbk * c.fps / GT[c.gt]};
  });
  const tongMbs = r.reduce((a, x) => a + x.mbs, 0);
  const dem = r.reduce((a, x) => a + x.mbk * 20, 0) / 1024;
  //  RAM can = bo dem anh (20 khung/cam) + ~12GB Windows & phan mem vision + 8GB neu chay AI + 16GB neu huan luyen
  const canRam = dem + 12 + (CHUNG.ai !== "khong" ? 8 : 0) + (CHUNG.ai === "huan_luyen" ? 16 : 0);
  //  MB anh kiem moi ngay -> TB can giu
  const mbNgay = r.reduce((a, x) => a + x.mbk * x.luu, 0) * 3600 * CHUNG.gio;
  const ng = CHUNG.ng / 100;
  const tbNG = mbNgay * ng * CHUNG.ngNen * CHUNG.ngNgay / 1e6;
  const tbOK = mbNgay * (1 - ng) * CHUNG.okNen * CHUNG.okNgay / Math.max(1, CHUNG.okN) / 1e6;
  const tbTho = mbNgay * Math.max(CHUNG.ngNgay, CHUNG.okNgay) / 1e6;   // neu luu het anh tho - de so sanh
  const dem_gt = (g) => r.filter(x => x.gt === g).length;
  const gige = dem_gt("GigE") + dem_gt("2.5GigE") + dem_gt("5GigE");
  const khe = Math.ceil(Math.max(0, gige - 1) / 4) + Math.ceil(dem_gt("10GigE") / 2) + Math.ceil(dem_gt("USB3") / 4)
    + Math.ceil(dem_gt("CL Base") / 2) + dem_gt("CL Medium") + dem_gt("CL Full") + dem_gt("CL Deca")   // frame grabber: 2 cam Base / 1 cam con lai
    + Math.ceil(dem_gt("CXP-12 ×1") / 4) + dem_gt("CXP-12 ×4");
  const poe = gige * 13;
  return {r, tongMbs, dem, canRam, tbNG, tbOK, tb: CHUNG.luuAnh ? tbNG + tbOK : 0, tbTho, gige, khe, poe, maxDim: Math.max(...r.map(x => DP[x.dp][0]))};
}
//  Danh gia mot khung: kiem phan co dinh, roi lay cau hinh nho nhat trong khung du RAM (+ du cho anh neu bat tinh luu anh)
function danhGia(k, kq) {
  const dat = [], can = [], khong = [], tin = [];
  const ds = CH.filter(c => c.kh === k.id);
  if (k.khe === 0 && k.lan === 0) khong.push("Máy phụ trợ — không thu ảnh trực tiếp");
  if (CHUNG.ai !== "khong" && k.gpu === "0") khong.push("Chạy AI cần GPU rời — khung này không có");
  if (CHUNG.ai === "huan_luyen" && k.vram && k.vram < 16) can.push(`Huấn luyện tại máy: VRAM ${k.vram}GB dễ thiếu — nên ≥ 16GB`);
  const camLan = kq.gige > 0 ? 1 : 0;
  if (kq.khe > k.khe || (kq.gige > 0 && k.lan < 1 && k.khe === 0)) khong.push(`Cần ${kq.khe} khe card camera + ${camLan} cổng LAN — máy có ${k.khe} khe`);
  else dat.push(`Cổng/khe đủ: cần ${kq.khe} khe card (${k.khe} trống) + ${camLan} cổng LAN onboard`);
  const duRam = (c) => c.r >= kq.canRam, duAnh = (c) => !CHUNG.luuAnh || choAnh(c) >= kq.tb;
  let c = ds.find(x => duRam(x) && duAnh(x));
  if (c) {
    dat.push(`RAM cần ~${Math.ceil(kq.canRam)}GB → ${c.r}GB`);
    if (CHUNG.luuAnh) dat.push(`Ảnh lưu ~${kq.tb.toFixed(2)}TB → chứa được ~${choAnh(c).toFixed(2)}TB ${c.d === "D0" ? "(phân vùng ảnh trên SSD hệ thống)" : "(ổ dữ liệu)"}`);
  } else if ((c = ds.find(duRam))) {
    dat.push(`RAM cần ~${Math.ceil(kq.canRam)}GB → ${c.r}GB`);
    c = ds.filter(duRam).sort((a, b) => choAnh(b) - choAnh(a))[0];
    can.push(`Ảnh lưu ~${kq.tb.toFixed(1)}TB, cấu hình lớn nhất khung chứa ~${choAnh(c).toFixed(1)}TB → dùng NAS, giảm số ngày giữ, hoặc thêm cấu hình ổ lớn hơn`);
  } else {
    c = ds[ds.length - 1];
    khong.push(`RAM cần ~${Math.ceil(kq.canRam)}GB — cấu hình lớn nhất của khung có ${Math.max(...ds.map(x => x.r))}GB`);
  }
  if (c.d !== "D0" && c.dd === "C" && CHUNG.ca) tin.push("Ổ dữ liệu dòng C trên dây chuyền 24/7: phần mềm không treo khi ổ lỗi/đầy, theo dõi SMART, ổ TBW cao (không QLC)");
  if (CHUNG.ca && (k.rd !== "I" || k.sd !== "I")) {
    if (k.rd === "?" || k.sd === "?") can.push("Dây chuyền 24/7: chưa rõ RAM/SSD có phải dòng công nghiệp — kiểm tra trước");
    else can.push("Dây chuyền 24/7: khung dùng RAM/SSD dòng thường — không đạt");
  }
  const tai = k.tai + (k.khe > 0 ? kq.poe : 0);   // PoE cap tu card trong may
  if (tai / k.p > 0.7) can.push(`Tải đỉnh ~${tai}W = ${Math.round(tai / k.p * 100)}% nguồn (có PoE ${kq.poe}W) → cấp PoE bằng switch ngoài`);
  if (kq.maxDim >= 5000 && k.cap !== "D" && CHUNG.ai !== "khong") can.push("Ảnh ≥ 20MP chạy AI: cân nhắc cấp D");
  const muc = khong.length ? "khong" : can.length ? "can" : "dat";
  return {k, c, dat, can, khong, tin, muc};
}
